<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExplAIn Workbook</title>
  <meta name="description" content="Your ExplAIn course workbook: every exercise, your product's system map and your capstone, in one place.">
  <meta name="theme-color" content="#0B1026">
  <link rel="icon" type="image/png" href="../assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1026; --navy-2: #121a3a; --violet: #7c3aed; --violet-soft: #9d64ff; --blue: #3b82f6;
      --lavender: #ede9fe; --off-white: #f8fafc; --text: #3f4859; --muted: #667085; --line: #e4e8f1;
      --grad: linear-gradient(115deg, #7c3aed, #3b82f6);
    }
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--off-white); font-family: Poppins, ui-sans-serif, system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    h1, h2, h3 { margin: 0; color: var(--navy); }
    :focus-visible { outline: 3px solid var(--violet-soft); outline-offset: 2px; }
    button { font: inherit; cursor: pointer; }

    /* Top bar */
    .topbar { position: sticky; top: 0; z-index: 20; color: #fff; background: rgba(9, 13, 33, .92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: min(1240px, calc(100% - 32px)); min-height: 68px; margin: auto; }
    .brand { display: flex; align-items: center; gap: 14px; color: #fff; text-decoration: none; }
    .brand img { height: 40px; width: auto; display: block; }
    .brand span { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.18); color: #c9d0e4; font-size: 13px; font-weight: 500; }
    .save-state { color: #9aa5c4; font-size: 12px; white-space: nowrap; }
    .save-state::before { content: "●"; margin-right: 6px; color: #34d399; }
    .save-state.off::before { color: #f59e0b; }

    /* Layout */
    .layout { display: grid; grid-template-columns: 264px 1fr; gap: 36px; width: min(1240px, calc(100% - 32px)); margin: 32px auto 80px; align-items: start; }
    .sidebar { position: sticky; top: 92px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    .who { padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: #fff; }
    .who label { display: block; margin-bottom: 6px; color: var(--navy); font-size: 12px; font-weight: 600; }
    .progress { margin-top: 14px; }
    .progress-bar { height: 6px; overflow: hidden; border-radius: 99px; background: var(--lavender); }
    .progress-bar i { display: block; height: 100%; width: 0; background: var(--grad); transition: width .3s ease; }
    .progress p { margin: 8px 0 0; color: var(--muted); font-size: 12px; }

    .nav { display: grid; gap: 4px; margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 18px; background: #fff; list-style: none; }
    .nav a { display: grid; grid-template-columns: 32px 1fr 14px; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; color: var(--navy); font-size: 13.5px; font-weight: 500; text-decoration: none; }
    .nav a:hover { background: #f5f3ff; }
    .nav a[aria-current="page"] { background: var(--lavender); color: #4c1d95; font-weight: 600; }
    .nav .num { height: 28px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: var(--navy-2); font-size: 11px; font-weight: 600; }
    .nav .num.alt { background: var(--grad); }
    .dot { width: 10px; height: 10px; border: 2px solid #cbd2e1; border-radius: 50%; }
    .dot.started { border-color: var(--violet-soft); background: #fff; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 5px var(--violet-soft); }
    .dot.done { border-color: var(--violet); background: var(--violet); }
    .nav .sep { height: 1px; margin: 6px 10px; background: var(--line); }

    /* Content */
    main { min-width: 0; }
    .panel-head { margin-bottom: 26px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; margin: 0 0 12px; color: var(--violet); font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 28px; height: 2px; border-radius: 2px; background: var(--grad); }
    .panel-head h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.1; letter-spacing: -.04em; }
    .quote { display: inline-block; margin: 14px 0 0; padding: 8px 14px; border-radius: 12px; color: #4c1d95; background: var(--lavender); font-size: 14px; font-weight: 500; }
    .intro { max-width: 680px; margin: 12px 0 0; color: var(--muted); font-size: 15px; }

    .card { margin-bottom: 18px; padding: 26px; border: 1px solid var(--line); border-radius: 22px; background: #fff; }
    .card h2 { font-size: 19px; letter-spacing: -.02em; }
    .card .hint { margin: 6px 0 18px; color: var(--muted); font-size: 14px; }
    .field { display: grid; gap: 6px; margin-top: 14px; }
    .field:first-of-type { margin-top: 0; }
    .field label { color: var(--navy); font-size: 13px; font-weight: 600; }
    .field small { color: #8a92a6; font-size: 12px; font-weight: 400; }
    input[type="text"], textarea {
      width: 100%; padding: 12px 14px; border: 1px solid #d6dbe7; border-radius: 12px; color: var(--navy); background: #fbfcfe;
      font: 15px/1.5 Poppins, ui-sans-serif, system-ui, sans-serif; transition: border-color .2s ease, box-shadow .2s ease; resize: vertical;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(124,58,237,.12); outline: none; }
    textarea { min-height: 76px; }

    .map-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .map-cell { display: grid; gap: 6px; align-content: start; padding: 12px; border: 1px solid #e3def9; border-radius: 14px; background: #fbfaff; }
    .map-cell label { color: var(--navy); font-size: 13px; font-weight: 600; }
    .map-cell label small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; line-height: 1.4; }
    .map-cell textarea { min-height: 84px; padding: 10px 12px; font-size: 14px; background: #fff; }
    .map-cell.model { border: 0; background: var(--grad); }
    .map-cell.model label, .map-cell.model label small { color: #fff; }

    .from-notes { margin-top: 8px; padding: 10px 12px; border-left: 3px solid var(--violet-soft); border-radius: 0 10px 10px 0; background: #faf9ff; color: #4f596d; font-size: 13px; }
    .from-notes b { display: block; margin-bottom: 2px; color: #4c1d95; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
    .from-notes p { margin: 4px 0 0; white-space: pre-wrap; }

    .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font-size: 14px; font-weight: 600; text-decoration: none; }
    .btn-primary { color: #fff; background: var(--grad); box-shadow: 0 10px 26px rgba(99, 82, 246, .28); }
    .btn-outline { color: var(--navy); border: 1px solid var(--line); background: #fff; }
    .btn-danger { color: #b91c1c; border: 1px solid #f3d0d0; background: #fff; }
    .pager .btn:only-child { margin-left: auto; }

    /* Summary */
    .summary-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .sum-block { margin-bottom: 18px; padding: 26px; border: 1px solid var(--line); border-radius: 22px; background: #fff; break-inside: avoid; }
    .sum-block h2 { margin-bottom: 14px; font-size: 19px; letter-spacing: -.02em; }
    .sum-meta { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 14px; }
    .sum-meta b { color: var(--navy); }
    .sum-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .sum-map div { padding: 12px; border: 1px solid #e3def9; border-radius: 12px; background: #fbfaff; }
    .sum-map div.model { border: 0; color: #fff; background: var(--grad); }
    .sum-map h3 { font-size: 13px; }
    .sum-map .model h3 { color: #fff; }
    .sum-text { margin: 4px 0 0; font-size: 13.5px; white-space: pre-wrap; }
    .empty { color: #a0a7b8; font-style: italic; }
    .sum-module { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
    .sum-module:first-of-type { border-top: 0; padding-top: 0; }
    .sum-module .num { height: 36px; display: grid; place-items: center; border-radius: 10px; color: #fff; background: var(--navy-2); font-size: 12px; font-weight: 600; }
    .sum-module h3 { font-size: 15px; }
    .sum-module dl { display: grid; grid-template-columns: 130px 1fr; gap: 4px 14px; margin: 8px 0 0; font-size: 13.5px; }
    .sum-module dt { color: var(--muted); font-weight: 500; }
    .sum-module dd { margin: 0; white-space: pre-wrap; }
    .status { display: inline-block; margin-left: 8px; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; vertical-align: 2px; }
    .status.done { color: #4c1d95; background: var(--lavender); }
    .status.started { color: #92400e; background: #fef3c7; }
    .status.todo { color: #6b7280; background: #eef1f6; }
    .sum-qa { padding: 12px 0; border-top: 1px solid var(--line); }
    .sum-qa:first-of-type { border-top: 0; padding-top: 0; }
    .sum-qa h3 { font-size: 14px; }

    .note { margin: 22px 0 0; color: var(--muted); font-size: 12.5px; }

    /* Cheat sheet card */
    .cheat { margin-bottom: 18px; border-radius: 22px; color: #e6e9f3; background: linear-gradient(145deg, #131c45, #0b1026 65%); }
    .cheat summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 20px 24px; cursor: pointer; list-style: none; }
    .cheat summary::-webkit-details-marker { display: none; }
    .cheat summary small { display: block; color: #a78bfa; font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
    .cheat summary b { display: block; margin-top: 4px; color: #fff; font-size: 16px; line-height: 1.35; }
    .cheat summary i { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; font-style: normal; transition: transform .2s ease; }
    .cheat[open] summary i { transform: rotate(45deg); }
    .cheat-body { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 24px 24px; }
    .cheat-body section { padding: 16px 18px; border: 1px solid rgba(255,255,255,.1); border-radius: 14px; background: rgba(255,255,255,.04); }
    .cheat-body section.wide { grid-column: span 2; background: rgba(124,58,237,.16); }
    .cheat-body h3 { margin: 0 0 8px; color: #fff; font-size: 13px; letter-spacing: .04em; }
    .cheat-body ol, .cheat-body ul { display: grid; gap: 6px; margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.45; }
    .cheat-body dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
    .cheat-body dt { color: #fff; font-weight: 600; }
    .cheat-body dd { margin: 0; color: #c9d0e4; }
    .cheat-body li::marker { color: #a78bfa; }
    .cheat-body .print { grid-column: span 2; justify-self: start; }
    @media (max-width: 640px) {
      .cheat-body { grid-template-columns: 1fr; padding: 0 16px 18px; }
      .cheat-body section.wide, .cheat-body .print { grid-column: auto; }
      .cheat-body dl { grid-template-columns: 1fr; }
    }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; gap: 20px; margin-top: 18px; }
      .sidebar { position: static; }
      .nav { display: flex; overflow-x: auto; padding: 6px; scrollbar-width: none; }
      .nav a { grid-template-columns: 28px auto 12px; white-space: nowrap; }
      .nav .label-long { display: none; }
      .nav .sep { width: 1px; height: auto; margin: 6px 2px; }
    }
    @media (max-width: 640px) {
      .brand span { display: none; }
      .card, .sum-block { padding: 20px 16px; }
      .map-grid, .sum-map { grid-template-columns: 1fr 1fr; }
      .map-cell.model, .sum-map .model { grid-column: span 2; order: -1; }
      .sum-module dl { grid-template-columns: 1fr; }
      .sum-module dt { margin-top: 6px; }
      .pager .btn { flex: 1; }
    }
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; }
      .topbar, .sidebar, .pager, .summary-actions, .note { display: none !important; }
      .layout { display: block; width: 100%; margin: 0; }
      .sum-block, .card { border-color: #d9deea; }
      .sum-map div.model, .map-cell.model, .nav .num, .sum-module .num { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="../index.html"><img src="../assets/logo-white.png" alt="ExplAIn" width="545" height="201"><span>Course workbook</span></a>
      <span class="save-state" id="save-state" role="status" aria-live="polite">Saved on this device</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="who">
        <label for="participant-name">Your name</label>
        <input type="text" id="participant-name" autocomplete="name" placeholder="First and last name">
        <div class="progress">
          <div class="progress-bar"><i id="progress-fill"></i></div>
          <p id="progress-text">0 of 10 sections complete</p>
        </div>
      </div>
      <nav aria-label="Workbook sections"><ul class="nav" id="nav"></ul></nav>
    </aside>
    <main id="panel" tabindex="-1"></main>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="cheatsheets/data.js"></script>

  <script>
    // ---------- Course structure ----------
    const MAP_BOXES = [
      { key: 'context', title: 'Context', hint: 'What the model sees on each call' },
      { key: 'knowledge', title: 'Knowledge', hint: 'Where facts and documents come from' },
      { key: 'memory', title: 'Memory and state', hint: 'What persists between turns' },
      { key: 'tools', title: 'Tools and actions', hint: 'What it can do; who executes it' },
      { key: 'model', title: 'Model', hint: 'What the model itself does, and nothing more' },
      { key: 'orchestration', title: 'Orchestration', hint: 'Steps and loops around model calls' },
      { key: 'guardrails', title: 'Guardrails', hint: 'What it may see and do' },
      { key: 'evaluation', title: 'Evaluation', hint: 'How anyone knows it works' },
      { key: 'interface', title: 'Interface', hint: 'Where people meet it' },
    ];

    const productTask = (question) => ({ title: 'In my product', hint: question, fields: [{ id: 'product', label: 'My notes', rows: 4 }] });
    const takeaway = { title: 'Takeaway', fields: [{ id: 'takeaway', label: 'My one-sentence takeaway', rows: 2 }] };

    const MODULES = [
      {
        id: 'm00', num: '00', label: 'The map', title: 'What is an AI system?', quote: 'The model generates. The system does.',
        groups: [
          { title: 'Group exercise: dissect a real product', hint: 'Map the product your group was given into every box.', fields: [
            { id: 'group_product', label: 'Product your group mapped', type: 'text' },
            { id: 'group_map', type: 'map' } ] },
          { title: 'Reflect', fields: [
            { id: 'surprise', label: 'Which box surprised your group?', rows: 2 },
            { id: 'blamed', label: 'One thing people blame on “the AI” that is really the system', rows: 2 } ] },
          { title: 'Check your map', hint: 'A support bot starts quoting outdated refund terms.', fields: [
            { id: 'check_places', label: 'Three places the problem could be', rows: 3 },
            { id: 'check_model', label: 'Which one is the model?', rows: 2 } ] },
          { title: 'Homework: your own product', hint: 'Pick one AI product you use or build. This map becomes your capstone.', fields: [
            { id: 'my_product', label: 'My product', type: 'text', key: 'product-name' },
            { id: 'my_map', type: 'map' } ] },
          takeaway,
        ],
      },
      { id: 'm01', num: '01', label: 'Inside the model', title: 'How a model sees the world', quote: 'Context is the model’s working reality.', groups: [
        { title: 'Applied exercise', hint: 'Predict which of three differently structured contexts will produce the strongest answer—and explain why.', fields: [{ id: 'exercise', label: 'My prediction and why', rows: 5 }] },
        productTask('What enters the model’s context in my product, and what might get diluted?'), takeaway ] },
      { id: 'm02', num: '02', label: 'Learning', title: 'How models learn', quote: 'Training changes the model. Inference uses it.', groups: [
        { title: 'Applied exercise', hint: 'Classify which actions change model parameters, context, memory or application state.', fields: [{ id: 'exercise', label: 'My classification', rows: 5 }] },
        productTask('In my product, what changes the model, what changes the context and what changes stored state?'), takeaway ] },
      { id: 'm03', num: '03', label: 'Probability', title: 'Reasoning, sampling and hallucination', quote: 'Fluency is not the same as truth.', groups: [
        { title: 'Applied exercise', hint: 'Decide where probability is acceptable in six product scenarios and where verification must be deterministic.', fields: [{ id: 'exercise', label: 'My decisions', rows: 5 }] },
        productTask('Where is probability acceptable in my product, and where must the answer be verified?'), takeaway ] },
      { id: 'm04', num: '04', label: 'Context', title: 'Context engineering', quote: 'Construct the world the model reasons inside.', groups: [
        { title: 'Applied exercise', hint: 'Redesign an overloaded assistant context with conflicting instructions, irrelevant history and poor retrieval.', fields: [{ id: 'exercise', label: 'My redesign', rows: 5 }] },
        productTask('How is my product’s context built, and what would I change?'), takeaway ] },
      { id: 'm05', num: '05', label: 'Knowledge', title: 'Retrieval, memory and fine-tuning', quote: 'Information, state and behavior are different problems.', groups: [
        { title: 'Applied exercise', hint: 'Choose prompt, retrieval, memory, database, fine-tuning—or a combination—for five product scenarios.', fields: [{ id: 'exercise', label: 'My choices', rows: 5 }] },
        productTask('Where does my product’s knowledge come from, and where does its state live?'), takeaway ] },
      { id: 'm06', num: '06', label: 'Tools', title: 'How models interact with the real world', quote: 'The model requests. Another system acts.', groups: [
        { title: 'Applied exercise', hint: 'Design the tool surface of a travel assistant and decide which capabilities should never be exposed directly.', fields: [{ id: 'exercise', label: 'My tool design', rows: 5 }] },
        productTask('Which tools can act in my product, and what should never be exposed directly?'), takeaway ] },
      { id: 'm07', num: '07', label: 'Agents', title: 'Agents without the mythology', quote: 'An agent is a loop with model-selected decisions.', groups: [
        { title: 'Applied exercise', hint: 'Redesign four use cases as workflows, partially agentic systems and autonomous agents, then compare risk.', fields: [{ id: 'exercise', label: 'My comparison', rows: 5 }] },
        productTask('Should my product be a workflow or an agent? Where does autonomy help, and where does it add risk?'), takeaway ] },
      { id: 'm08', num: '08', label: 'Evals', title: 'Building AI you can trust', quote: 'A demo is not a system.', groups: [
        { title: 'Applied exercise', hint: 'Compare two architectures where one performs better but is substantially slower and more expensive. Decide what belongs in production.', fields: [{ id: 'exercise', label: 'My decision', rows: 5 }] },
        productTask('How would I know my product works, and what would I measure?'), takeaway ] },
    ];

    const CAPSTONE = [
      { id: 'q1', q: 'What is the model doing?', from: [['m00.my_map.model', 'Module 00 · your map'], ['m02.product', 'Module 02']] },
      { id: 'q2', q: 'What enters context?', from: [['m00.my_map.context', 'Module 00 · your map'], ['m01.product', 'Module 01'], ['m04.product', 'Module 04']] },
      { id: 'q3', q: 'Where does knowledge come from?', from: [['m00.my_map.knowledge', 'Module 00 · your map'], ['m05.product', 'Module 05']] },
      { id: 'q4', q: 'Where does state live?', from: [['m00.my_map.memory', 'Module 00 · your map'], ['m05.product', 'Module 05']] },
      { id: 'q5', q: 'Which tools can act?', from: [['m00.my_map.tools', 'Module 00 · your map'], ['m06.product', 'Module 06']] },
      { id: 'q6', q: 'What is probabilistic?', from: [['m03.product', 'Module 03']] },
      { id: 'q7', q: 'What must be deterministic?', from: [['m03.product', 'Module 03'], ['m07.product', 'Module 07']] },
      { id: 'q8', q: 'How do we know it works?', from: [['m00.my_map.evaluation', 'Module 00 · your map'], ['m08.product', 'Module 08']] },
    ];

    // ---------- Storage (this browser only) ----------
    const STORAGE_KEY = 'explain-workbook-v1';
    let data = { v: 1, name: '', fields: {}, updated: null };
    let canStore = true;
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && saved.fields) data = saved;
    } catch (e) { canStore = false; }

    const saveState = document.getElementById('save-state');
    let saveTimer;
    function persist() {
      data.updated = new Date().toISOString();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          saveState.textContent = 'Saved on this device';
          saveState.classList.remove('off');
        } catch (e) {
          saveState.textContent = 'Not saving: download a backup';
          saveState.classList.add('off');
        }
      }, 300);
    }
    if (!canStore) { saveState.textContent = 'Not saving: download a backup'; saveState.classList.add('off'); }

    const get = (key) => (data.fields[key] || '').trim();
    function set(key, value) { data.fields[key] = value; persist(); updateProgress(); }

    // ---------- Completion ----------
    function fieldKeys(module) {
      const keys = [];
      module.groups.forEach((g) => g.fields.forEach((f) => {
        if (f.type === 'map') MAP_BOXES.forEach((b) => keys.push(`${module.id}.${f.id}.${b.key}`));
        else keys.push(`${module.id}.${f.id}`);
      }));
      return keys;
    }
    const capstoneKeys = () => CAPSTONE.map((c) => `capstone.${c.id}`);
    function statusOf(keys) {
      const filled = keys.filter((k) => get(k)).length;
      return filled === 0 ? 'todo' : filled === keys.length ? 'done' : 'started';
    }
    const sectionStatus = (id) => (id === 'capstone' ? statusOf(capstoneKeys()) : statusOf(fieldKeys(MODULES.find((m) => m.id === id))));

    function updateProgress() {
      const ids = [...MODULES.map((m) => m.id), 'capstone'];
      const done = ids.filter((id) => sectionStatus(id) === 'done').length;
      document.getElementById('progress-fill').style.width = `${(done / ids.length) * 100}%`;
      document.getElementById('progress-text').textContent = `${done} of ${ids.length} sections complete`;
      ids.forEach((id) => {
        const dot = document.querySelector(`[data-dot="${id}"]`);
        if (dot) dot.className = `dot ${sectionStatus(id)}`;
      });
    }

    // ---------- DOM helpers ----------
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else node.setAttribute(k, v);
      });
      children.flat().forEach((c) => c && node.append(c));
      return node;
    }
    function input(key, { type = 'textarea', rows = 3, id, placeholder } = {}) {
      const node = type === 'text' ? el('input', { type: 'text', id }) : el('textarea', { id, rows: String(rows) });
      node.value = data.fields[key] || '';
      if (placeholder) node.placeholder = placeholder;
      node.addEventListener('input', () => set(key, node.value));
      return node;
    }
    function mapGrid(prefix) {
      return el('div', { class: 'map-grid' }, MAP_BOXES.map((b) => {
        const id = `f-${prefix.replace(/\./g, '-')}-${b.key}`;
        return el('div', { class: `map-cell${b.key === 'model' ? ' model' : ''}` },
          el('label', { for: id }, b.title, el('small', { text: b.hint })),
          input(`${prefix}.${b.key}`, { id, rows: 3 }));
      }));
    }
    const textOrEmpty = (value, fallback = 'Not filled in yet') =>
      value ? el('p', { class: 'sum-text', text: value }) : el('p', { class: 'sum-text empty', text: fallback });

    // ---------- Navigation ----------
    const SECTIONS = [...MODULES.map((m) => ({ id: m.id, num: m.num, label: m.label })), { sep: true },
      { id: 'capstone', num: 'C', label: 'Capstone', alt: true }, { id: 'summary', num: 'Σ', label: 'Summary', alt: true, noDot: true }];

    function buildNav() {
      const nav = document.getElementById('nav');
      SECTIONS.forEach((s) => {
        if (s.sep) { nav.append(el('li', { class: 'sep', 'aria-hidden': 'true' })); return; }
        nav.append(el('li', {}, el('a', { href: `#${s.id}`, 'data-section': s.id },
          el('span', { class: `num${s.alt ? ' alt' : ''}`, text: s.num }),
          el('span', { text: s.label }),
          s.noDot ? el('span') : el('span', { class: 'dot', 'data-dot': s.id }))));
      });
    }

    function pager(currentId) {
      const ids = SECTIONS.filter((s) => !s.sep).map((s) => s.id);
      const i = ids.indexOf(currentId);
      const name = (id) => { const s = SECTIONS.find((x) => x.id === id); return s.id.startsWith('m') ? `Module ${s.num}` : s.label; };
      return el('div', { class: 'pager' },
        i > 0 ? el('a', { class: 'btn btn-outline', href: `#${ids[i - 1]}`, text: `← ${name(ids[i - 1])}` }) : null,
        i < ids.length - 1 ? el('a', { class: 'btn btn-primary', href: `#${ids[i + 1]}`, text: `${name(ids[i + 1])} →` }) : null);
    }

    // ---------- Views ----------
    function cheatCard(m) {
      const cs = (window.EXPLAIN_CHEATSHEETS || {})[m.id];
      if (!cs) return null;
      const list = (tag, items) => el(tag, {}, items.map((t) => el('li', { text: t })));
      const toolLabel = { checklist: 'Checklist', template: 'Template', decision: 'Decision guide' }[cs.tool.kind] || 'Tool';
      return el('details', { class: 'cheat' },
        el('summary', {}, el('span', {}, el('small', { text: 'Cheat sheet · for your projects' }), el('b', { text: cs.big_idea })), el('i', { 'aria-hidden': 'true', text: '+' })),
        el('div', { class: 'cheat-body' },
          el('section', {}, el('h3', { text: 'Ask on every project' }), list('ol', cs.ask)),
          el('section', {}, el('h3', { text: 'Rules of thumb' }), list('ul', cs.rules)),
          el('section', {}, el('h3', { text: 'Red flags' }), list('ul', cs.red_flags)),
          el('section', {}, el('h3', { text: 'Key terms' }), el('dl', {}, cs.terms.map((t) => [el('dt', { text: t.term }), el('dd', { text: t.def })]))),
          el('section', { class: 'wide' }, el('h3', { text: `${toolLabel}: ${cs.tool.title}` }), list('ul', cs.tool.items)),
          el('a', { class: 'btn btn-outline print', href: `cheatsheets/module-${m.num}.pdf`, target: '_blank', rel: 'noopener', text: 'Printable cheat sheet (PDF)' })));
    }

    function moduleView(m) {
      const cards = m.groups.map((g) => el('section', { class: 'card' },
        el('h2', { text: g.title }),
        g.hint ? el('p', { class: 'hint', text: g.hint }) : el('div', { style: 'height:14px' }),
        g.fields.map((f) => {
          const key = `${m.id}.${f.id}`;
          if (f.type === 'map') return mapGrid(key);
          const id = `f-${m.id}-${f.id}`;
          return el('div', { class: 'field' }, el('label', { for: id, text: f.label }), input(key, { type: f.type, rows: f.rows, id }));
        })));
      return [
        el('div', { class: 'panel-head' },
          el('p', { class: 'eyebrow', text: `Module ${m.num} · ${m.label}` }),
          el('h1', { text: m.title }),
          el('p', { class: 'quote', text: `“${m.quote}”` })),
        cheatCard(m), cards, pager(m.id)];
    }

    function capstoneView() {
      const product = get('m00.my_product');
      return [
        el('div', { class: 'panel-head' },
          el('p', { class: 'eyebrow', text: 'Capstone' }),
          el('h1', { text: 'Your AI System Map' }),
          el('p', { class: 'intro', text: product
            ? `Dissect ${product} clearly enough to expose its trade-offs, risks and failure points. Your notes from each module appear under each question.`
            : 'Dissect your product clearly enough to expose its trade-offs, risks and failure points. Name your product in Module 00’s homework first.' })),
        el('section', { class: 'card' }, CAPSTONE.map((c, i) => {
          const id = `f-capstone-${c.id}`;
          const notes = c.from.filter(([k]) => get(k));
          return el('div', { class: 'field', style: i ? 'margin-top:26px' : '' },
            el('label', { for: id, text: `${i + 1}. ${c.q}` }),
            input(`capstone.${c.id}`, { id, rows: 4 }),
            notes.length ? el('div', { class: 'from-notes' }, el('b', { text: 'From your notes' }),
              notes.map(([k, label]) => el('p', {}, el('strong', { text: `${label}: ` }), get(k)))) : null);
        })),
        pager('capstone')];
    }

    function summaryView() {
      const name = data.name.trim();
      const product = get('m00.my_product');
      const updated = data.updated ? new Date(data.updated).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
      const statusLabel = { done: 'Complete', started: 'In progress', todo: 'Not started' };

      return [
        el('div', { class: 'panel-head' },
          el('p', { class: 'eyebrow', text: 'Course summary' }),
          el('h1', { text: name ? `${name}’s ExplAIn summary` : 'Your ExplAIn summary' }),
          el('div', { class: 'summary-actions' },
            el('button', { class: 'btn btn-primary', type: 'button', id: 'print-btn', text: 'Print or save as PDF' }),
            el('button', { class: 'btn btn-outline', type: 'button', id: 'export-btn', text: 'Download backup' }),
            el('button', { class: 'btn btn-outline', type: 'button', id: 'import-btn', text: 'Restore from backup' }),
            el('button', { class: 'btn btn-danger', type: 'button', id: 'clear-btn', text: 'Clear workbook' }))),

        el('section', { class: 'sum-block' },
          el('div', { class: 'sum-meta' },
            el('span', {}, 'Participant: ', el('b', { text: name || '—' })),
            el('span', {}, 'Product: ', el('b', { text: product || '—' })),
            el('span', {}, 'Last updated: ', el('b', { text: updated })))),

        el('section', { class: 'sum-block' },
          el('h2', { text: product ? `System map: ${product}` : 'System map of my product' }),
          el('div', { class: 'sum-map' }, MAP_BOXES.map((b) => el('div', { class: b.key === 'model' ? 'model' : '' },
            el('h3', { text: b.title }), textOrEmpty(get(`m00.my_map.${b.key}`), '—'))))),

        el('section', { class: 'sum-block' },
          el('h2', { text: 'Module by module' }),
          MODULES.map((m) => {
            const st = sectionStatus(m.id);
            const rows = [['Takeaway', get(`${m.id}.takeaway`)]];
            if (m.id !== 'm00') rows.push(['In my product', get(`${m.id}.product`)], ['Exercise', get(`${m.id}.exercise`)]);
            else rows.push(['Surprise', get('m00.surprise')], ['Check answer', get('m00.check_places')]);
            return el('div', { class: 'sum-module' },
              el('span', { class: 'num', text: m.num }),
              el('div', {},
                el('h3', {}, m.title, el('span', { class: `status ${st}`, text: statusLabel[st] })),
                el('dl', {}, rows.map(([dt, dd]) => [el('dt', { text: dt }), el('dd', { class: dd ? '' : 'empty', text: dd || '—' })]))));
          })),

        el('section', { class: 'sum-block' },
          el('h2', {}, 'Capstone: AI System Map', el('span', { class: `status ${sectionStatus('capstone')}`, text: statusLabel[sectionStatus('capstone')] })),
          CAPSTONE.map((c, i) => el('div', { class: 'sum-qa' }, el('h3', { text: `${i + 1}. ${c.q}` }), textOrEmpty(get(`capstone.${c.id}`))))),

        el('section', { class: 'sum-block' },
          el('h2', { text: 'Your cheat sheets' }),
          el('p', { class: 'sum-text', text: 'One page per module: questions to ask, rules of thumb, red flags, key terms and a working tool for real projects.' }),
          el('div', { class: 'summary-actions' }, el('a', { class: 'btn btn-primary', href: 'cheatsheets/ExplAIn-Course-Cheat-Sheets.pdf', target: '_blank', rel: 'noopener', text: 'All cheat sheets (PDF)' }))),
        el('p', { class: 'note', text: 'Your answers are stored only in this browser. Download a backup to move them to another device or keep a copy.' }),
        pager('summary')];
    }

    // ---------- Routing ----------
    const panel = document.getElementById('panel');
    function render() {
      const id = (location.hash || '#m00').slice(1);
      const valid = SECTIONS.some((s) => s.id === id) ? id : 'm00';
      const m = MODULES.find((x) => x.id === valid);
      panel.replaceChildren(...[valid === 'capstone' ? capstoneView() : valid === 'summary' ? summaryView() : moduleView(m)].flat(2));
      document.querySelectorAll('[data-section]').forEach((a) => {
        if (a.dataset.section === valid) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
        else a.removeAttribute('aria-current');
      });
      if (valid === 'summary') bindSummaryActions();
      updateProgress();
    }

    function bindSummaryActions() {
      document.getElementById('print-btn').addEventListener('click', () => window.print());
      document.getElementById('export-btn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = el('a', { href: URL.createObjectURL(blob), download: `explain-workbook${data.name ? '-' + data.name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-') : ''}.json` });
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
      document.getElementById('import-btn').addEventListener('click', () => document.getElementById('import-file').click());
      document.getElementById('clear-btn').addEventListener('click', () => {
        if (!confirm('Clear every answer in this workbook? Download a backup first if you want to keep them.')) return;
        data = { v: 1, name: '', fields: {}, updated: null };
        document.getElementById('participant-name').value = '';
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
        render();
      });
    }

    document.getElementById('import-file').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (!parsed || typeof parsed.fields !== 'object') throw new Error('Not a workbook backup');
        const fields = {};
        Object.entries(parsed.fields).forEach(([k, v]) => { if (typeof v === 'string') fields[k] = v; });
        data = { v: 1, name: typeof parsed.name === 'string' ? parsed.name : '', fields, updated: parsed.updated || null };
        document.getElementById('participant-name').value = data.name;
        persist();
        render();
      } catch (e) {
        alert('That file isn’t an ExplAIn workbook backup.');
      }
    });

    const nameInput = document.getElementById('participant-name');
    nameInput.value = data.name || '';
    nameInput.addEventListener('input', () => { data.name = nameInput.value; persist(); });

    buildNav();
    window.addEventListener('hashchange', () => { render(); panel.focus({ preventScroll: true }); window.scrollTo(0, 0); });
    render();
  </script>
</body>
</html>
